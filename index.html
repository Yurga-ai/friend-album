<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотоальбом лучшего кента</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e272e 0%, #0f1012 100%);
            --card-bg: rgba(25, 25, 30, 0.9);
            --text-color: #f1f2f6;
            --primary: #d4af37;
            --primary-hover: #f1c40f;
            --shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: url('Gemini_Generated_Image_offlo6offlo6offl.jfif') no-repeat center center fixed;
            background-size: cover;
            background-color: #0f1012;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }

        /* Мегакрутой заголовок в ганста-реп стиле */
        .gangsta-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 20px;
            line-height: 1.1;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.8));
        }

        .gangsta-title .main-text {
            display: block;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffeaa7 0%, #d4af37 35%, #ffffff 50%, #718093 75%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 
                2px 2px 0px #000, 
                -2px -2px 0px #000, 
                2px -2px 0px #000, 
                -2px 2px 0px #000,
                0 0 20px rgba(212, 175, 55, 0.6);
        }

        .gangsta-title .sub-text {
            display: block;
            font-size: 0.85rem;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            color: #dcdde1;
            letter-spacing: 3px;
            margin-top: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .gangsta-title .chains-top, 
        .gangsta-title .chains-bottom {
            display: block;
            font-size: 1.2rem;
            letter-spacing: 6px;
            opacity: 0.9;
        }

        .gangsta-title .chains-top {
            margin-bottom: -5px;
        }

        .gangsta-title .chains-bottom {
            margin-top: -3px;
        }

        /* Кнопки категорий */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (max-width: 480px) {
            .buttons-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .age-btn {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #f1f2f6;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .age-btn span {
            font-size: 0.8rem;
            font-weight: normal;
            color: #a4b0be;
        }

        .age-btn:hover {
            transform: translateY(-5px);
            background: var(--primary);
            color: #1e272e;
            border-color: var(--primary);
        }

        .age-btn:hover span {
            color: #2f3542;
        }

        .age-btn.active {
            background: var(--primary-hover);
            color: #1e272e;
            transform: scale(0.98);
            border-color: var(--primary-hover);
        }

        .age-btn.active span {
            color: #2f3542;
        }

        /* Окно галереи */
        .gallery-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease-in-out;
            display: none;
        }

        .gallery-card.visible {
            display: block;
        }

        .gallery-title {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: 'Impact', sans-serif;
            letter-spacing: 1px;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        /* Стиль фоторамки */
        .photo-frame {
            background: #fff;
            padding: 8px 8px 25px 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border-radius: 4px;
            transform: rotate(-1deg);
            transition: transform 0.3s;
        }

        .photo-frame:nth-child(even) {
            transform: rotate(2deg);
        }

        .photo-frame:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 10;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        .photo-frame img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 2px;
            display: block;
        }

        .photo-caption {
            font-size: 0.8rem;
            color: #2f3542;
            margin-top: 8px;
            font-family: cursive, sans-serif;
            font-weight: bold;
        }

        .welcome-text {
            color: #a4b0be;
            font-style: italic;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Мегакрутая надпись с цепями -->
        <h1 class="gangsta-title">
            <span class="chains-top">⛓️ 🔗 ⛓️</span>
            <span class="main-text">ЛУЧШИЙ KENT</span>
            <span class="sub-text">Братство, лояльность, успех</span>
            <span class="chains-bottom">⛓️ 🔗 ⛓️</span>
        </h1>
        
        <!-- Блок музыкального плеера -->
        <div style="text-align: center; margin: 15px 0;">
            <audio id="bg-audio" loop>
                <source src="Max Schultz - The Howler.mp3" type="audio/mpeg">
                Ваш браузер не поддерживает аудио.
            </audio>
            <button onclick="toggleAudio()" id="audio-btn" style="background: var(--primary); color: #1e272e; border: none; padding: 10px 20px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(212,175,55,0.4);">
                ▶ Зацени трек
            </button>
        </div>

        <script>
            function toggleAudio() {
                const audio = document.getElementById('bg-audio');
                const btn = document.getElementById('audio-btn');
                
                if (audio.paused) {
                    audio.play();
                    btn.textContent = '⏸ Выключить музыку';
                } else {
                    audio.pause();
                    btn.textContent = '▶ Включить музыку';
                }
            }
        </script>

        <!-- Кнопки категорий для кента -->
        <div class="buttons-grid">
            <button class="age-btn" onclick="showGallery(0)">Шо ты малой <span>Зашкварные архивные</span></button>
            <button class="age-btn" onclick="showGallery(1)">Чисто движ <span>Улицы и районы</span></button>
            <button class="age-btn" onclick="showGallery(2)">Не открывай <span>Строго 18+</span></button>
            <button class="age-btn" onclick="showGallery(3)">Типа на стиле <span>Луки и прикиды</span></button>
            <button class="age-btn" onclick="showGallery(4)">Я тебя могну <span>Эпичные моменты</span></button>
            <button class="age-btn" onclick="showGallery(5)">Милота <span>По братски</span></button>
        </div>

        <!-- Контейнер для фотографий -->
        <div id="gallery-container">
            <div class="welcome-text">Нажми на любую кнопку выше, чтобы заценить движ 📸</div>
        </div>
    </div>

    <script>
        // Данные галереи фотографий кента
        const photoData = {
            0: {
                title: "Шо ты малой (Архив)",
                photos: [
                    { url: "20220401_141410.jpg", caption: "С чего всё начиналось" },
                    { url: "IMG_20261109_205812_018.jpg", caption: "Молодые и дерзкие" }
                ]
            },
            1: {
                title: "Чисто движ",
                photos: [
                    { url: "IMG_20261109_210822_258.jpg", caption: "На районе" },
                    { url: "IMG_20261109_220543_279.jpg", caption: "Вечерний променад" }
                ]
            },
            2: {
                title: "Не открывай",
                photos: [
                    { url: "IMG_20261109_222535_619.jpg", caption: "Без комментариев" },
                    { url: "IMG_20261109_222541_833.jpg", caption: "Это останется здесь" },
                    { url: "IMG_20261109_222537_445.jpg", caption: "Свои делишки" },
                    { url: "IMG_20261109_222539_950.jpg", caption: "Полный отрыв" },
                    { url: "IMG_20261109_222544_083.jpg", caption: "Утренний отходняк" }
                ]
            },
            3: {
                title: "Типа на стиле",
                photos: [
                    { url: "IMG_20261109_231018_791.jpg", caption: "При параде" },
                    { url: "IMG_20261109_231044_393.jpg", caption: "Прикинулся нормально" },
                    { url: "IMG_20261109_231232_422.jpg", caption: "Дорого-богато" },
                    { url: "IMG_20261109_231356_013.jpg", caption: "Чистый стиль" }
                ]
            },
            4: {
                title: "Я тебя могну",
                photos: [
                    { url: "IMG_20261109_231333_329.jpg", caption: "Морда кирпичом" },
                    { url: "IMG_20261109_231422_196.jpg", caption: "Серьозный тип" }
                ]
            },
            5: {
                title: "Милота по-братски",
                photos: [
                    { url: "IMG_20261109_231450_125.jpg", caption: "Легендарный день" },
                    { url: "IMG_20261109_231515_594.jpg", caption: "Уважуха" },
                    { url: "IMG_20261109_231502_111.jpg", caption: "Крепкая дружба" }
                ]
            }
        };

        function showGallery(age) {
            const buttons = document.querySelectorAll('.age-btn');
            buttons.forEach((btn, index) => {
                if(index === age) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const data = photoData[age];
            const container = document.getElementById('gallery-container');
            
            let html = `
                <div class="gallery-card visible">
                    <div class="gallery-title">${data.title}</div>
                    <div class="photos-grid">
            `;

            data.photos.forEach(photo => {
                html += `
                    <div class="photo-frame">
                        <img src="${photo.url}" alt="Фото">
                        <div class="photo-caption">${photo.caption}</div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }
    </script>
</body>
</html>
