<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотоальбом лучшего кента</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e272e 0%, #0f1012 100%);
            --card-bg: rgba(25, 25, 30, 0.9);
            --text-color: #f1f2f6;
            --primary: #d4af37;
            --primary-hover: #f1c40f;
            --shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: url('Gemini_Generated_Image_offlo6offlo6offl.jfif') no-repeat center center fixed;
            background-size: cover;
            background-color: #0f1012;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }

        /* Заголовок в ганста-реп стиле с цепями */
        .gangsta-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 20px;
            line-height: 1.1;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.8));
        }

        .gangsta-title .main-text {
            display: block;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffeaa7 0%, #d4af37 35%, #ffffff 50%, #718093 75%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 
                2px 2px 0px #000, 
                -2px -2px 0px #000, 
                2px -2px 0px #000, 
                -2px 2px 0px #000,
                0 0 20px rgba(212, 175, 55, 0.6);
        }

        .gangsta-title .chains-top, 
        .gangsta-title .chains-bottom {
            display: block;
            font-size: 1.2rem;
            letter-spacing: 6px;
            opacity: 0.9;
        }

        .gangsta-title .chains-top {
            margin-bottom: -5px;
        }

        .gangsta-title .chains-bottom {
            margin-top: -3px;
        }

        /* Блок медиа-плеера */
        .player-box {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        .media-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .media-btn {
            background: var(--primary);
            color: #1e272e;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212,175,55,0.4);
            transition: all 0.3s ease;
        }

        .media-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .current-track-info {
            font-size: 0.85rem;
            color: #dcdde1;
            font-style: italic;
            margin-top: 10px;
        }

        /* Кнопки категорий */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (max-width: 480px) {
            .buttons-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .age-btn {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #f1f2f6;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .age-btn span {
            font-size: 0.8rem;
            font-weight: normal;
            color: #a4b0be;
        }

        .age-btn:hover {
            transform: translateY(-5px);
            background: var(--primary);
            color: #1e272e;
            border-color: var(--primary);
        }

        .age-btn:hover span {
            color: #2f3542;
        }

        .age-btn.active {
            background: var(--primary-hover);
            color: #1e272e;
            transform: scale(0.98);
            border-color: var(--primary-hover);
        }

        .age-btn.active span {
            color: #2f3542;
        }

        /* Окно галереи */
        .gallery-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease-in-out;
            display: none;
        }

        .gallery-card.visible {
            display: block;
        }

        .gallery-title {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: 'Impact', sans-serif;
            letter-spacing: 1px;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        /* Видеоконтейнер */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        .photo-frame {
            background: #fff;
            padding: 8px 8px 25px 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border-radius: 4px;
            transform: rotate(-1deg);
            transition: transform 0.3s;
        }

        .photo-frame:nth-child(even) {
            transform: rotate(2deg);
        }

        .photo-frame:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 10;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        .photo-frame img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 2px;
            display: block;
        }

        .photo-caption {
            font-size: 0.8rem;
            color: #2f3542;
            margin-top: 8px;
            font-family: cursive, sans-serif;
            font-weight: bold;
        }

        .welcome-text {
            color: #a4b0be;
            font-style: italic;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Заголовок с цепями без подписи -->
        <h1 class="gangsta-title">
            <span class="chains-top">⛓️ 🔗 ⛓️</span>
            <span class="main-text">ЛУЧШИЙ KENT</span>
            <span class="chains-bottom">⛓️ 🔗 ⛓️</span>
        </h1>
        
        <!-- Плеер -->
        <div class="player-box">
            <audio id="bg-audio"></audio>
            <div id="controls-container" class="media-controls">
                <button onclick="playMusic()" class="media-btn">▶ Зацени трек</button>
                <button onclick="showYouTube()" class="media-btn">🎬 Ганста Видос</button>
            </div>
            <div id="track-info" class="current-track-info" style="display: none;"></div>
        </div>

        <!-- Кнопки категорий для кента -->
        <div class="buttons-grid">
            <button class="age-btn" onclick="showGallery(0)">Шо ты малой <span>Зашкварные архивные</span></button>
            <button class="age-btn" onclick="showGallery(1)">Чисто движ <span>Улицы и районы</span></button>
            <button class="age-btn" onclick="showGallery(2)">Не открывай <span>Строго 18+</span></button>
            <button class="age-btn" onclick="showGallery(3)">Типа на стиле <span>Луки и прикиды</span></button>
            <button class="age-btn" onclick="showGallery(4)">Я тебя могну <span>Эпичные моменты</span></button>
            <button class="age-btn" onclick="showGallery(5)">Милота <span>По братски</span></button>
        </div>

        <!-- Контейнер для фотографий и видео -->
        <div id="gallery-container">
            <div class="welcome-text">Тапай на кнопки - мы в одной лодке 📸</div>
        </div>
    </div>

    <script>
        // Плейлист из двух треков
        const playlist = [
            { src: "Snoop Dog feat. Dr. Dre - The Next Episode.mp3", title: "Snoop Dogg feat. Dr. Dre - The Next Episode" },
            { src: "Dr. Dre Feat. Snoop Dogg - Still D.R.E..mp3", title: "Dr. Dre Feat. Snoop Dogg - Still D.R.E." }
        ];

        let currentTrackIndex = 0;
        const audio = document.getElementById('bg-audio');
        const controlsContainer = document.getElementById('controls-container');
        const trackInfo = document.getElementById('track-info');

        // Первичное нажатие "Зацени трек"
        function playMusic() {
            audio.src = playlist[currentTrackIndex].src;
            audio.play().then(() => {
                updateActiveControls();
            }).catch(e => {
                console.log("Playback blocked", e);
            });
        }

        // Кнопка Пауза (возвращает сайт в изначальное состояние)
        function pauseMusic() {
            audio.pause();
            trackInfo.style.display = 'none';
            trackInfo.textContent = '';
            
            controlsContainer.innerHTML = `
                <button onclick="playMusic()" class="media-btn">▶ Зацени трек</button>
                <button onclick="showYouTube()" class="media-btn">🎬 Ганста Видос</button>
            `;
        }

        // Переключение на следующий трек
        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            audio.src = playlist[currentTrackIndex].src;
            audio.play();
            updateActiveControls();
        }

        // Обновление интерфейса панели при играющей музыке
        function updateActiveControls() {
            trackInfo.style.display = 'block';
            trackInfo.textContent = `Играет: ${playlist[currentTrackIndex].title}`;
            
            controlsContainer.innerHTML = `
                <button onclick="pauseMusic()" class="media-btn">⏸ Пауза</button>
                <button onclick="nextTrack()" class="media-btn">⏭ Следующий трек</button>
                <button onclick="showYouTube()" class="media-btn">🎬 Ганста Видос</button>
            `;
        }

        // Автоматический переход к следующему треку по окончании
        audio.addEventListener('ended', () => {
            nextTrack();
        });

        // Данные галереи фотографий кента
        const photoData = {
            0: {
                title: "Шо ты малой (Архив)",
                photos: [
                    { url: "детские фото.jfif", caption: "С чего всё начиналось" },
                    { url: "patrick feely & katie wilmot.jfif", caption: "Молодые и дерзкие" }
                ]
            },
            1: {
                title: "Чисто движ",
                photos: [
                    { url: "IMG_20261109_210822_258.jpg", caption: "На районе" },
                    { url: "IMG_20261109_220543_279.jpg", caption: "Вечерний променад" }
                ]
            },
            2: {
                title: "Не открывай",
                photos: [
                    { url: "IMG_20261109_222535_619.jpg", caption: "Без комментариев" },
                    { url: "это останется здесь.jfif", caption: "Это останется здесь" },
                    { url: "IMG_20261109_222537_445.jpg", caption: "Свои делишки" },
                    { url: "IMG_20261109_222539_950.jpg", caption: "Полный отрыв" },
                    { url: "IMG_20261109_222544_083.jpg", caption: "Утренний отходняк" }
                ]
            },
            3: {
                title: "Типа на стиле",
                photos: [
                    { url: "IMG_20261109_231018_791.jpg", caption: "При параде" },
                    { url: "IMG_20261109_231044_393.jpg", caption: "Прикинулся нормально" },
                    { url: "IMG_20261109_231232_422.jpg", caption: "Дорого-богато" },
                    { url: "IMG_20261109_231356_013.jpg", caption: "Чистый стиль" }
                ]
            },
            4: {
                title: "Я тебя могну",
                photos: [
                    { url: "IMG_20261109_231333_329.jpg", caption: "Морда кирпичом" },
                    { url: "IMG_20261109_231422_196.jpg", caption: "Серьозный тип" }
                ]
            },
            5: {
                title: "Милота по-братски",
                photos: [
                    { url: "IMG_20261109_231450_125.jpg", caption: "Легендарный день" },
                    { url: "IMG_20261109_231515_594.jpg", caption: "Уважуха" },
                    { url: "IMG_20261109_231502_111.jpg", caption: "Крепкая дружба" }
                ]
            }
        };

        function showGallery(age) {
            const buttons = document.querySelectorAll('.age-btn');
            buttons.forEach((btn, index) => {
                if(index === age) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const data = photoData[age];
            const container = document.getElementById('gallery-container');
            
            let html = `
                <div class="gallery-card visible">
                    <div class="gallery-title">${data.title}</div>
                    <div class="photos-grid">
            `;

            data.photos.forEach(photo => {
                html += `
                    <div class="photo-frame">
                        <img src="${photo.url}" alt="Фото">
                        <div class="photo-caption">${photo.caption}</div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // Функция для вывода YouTube плеера (при этом музыка останавливается и плеер сбрасывается)
        function showYouTube() {
            // Останавливаем музыку и сбрасываем плеер в исходное состояние
            audio.pause();
            trackInfo.style.display = 'none';
            trackInfo.textContent = '';
            controlsContainer.innerHTML = `
                <button onclick="playMusic()" class="media-btn">▶ Зацени трек</button>
                <button onclick="showYouTube()" class="media-btn">🎬 Ганста Видос</button>
            `;

            // Снимаем подсветку с кнопок категорий фото
            const buttons = document.querySelectorAll('.age-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            const container = document.getElementById('gallery-container');
            
            let html = `
                <div class="gallery-card visible">
                    <div class="gallery-title">Эксклюзивный движ с Ютуба</div>
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/XP4XjVwKVHQ?list=RDXP4XjVwKVHQ&autoplay=1" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }
    </script>
</body>
</html>
